services:
  db:
    image: mysql:8.0
    container_name: invito-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: invito123
      MYSQL_DATABASE: invito
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  db-data:
    name: invito_db_data
